<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pemrograman Web Dasar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="layout-utama">

    <!-- Baris 1: Navbar / Header -->
    <header class="navbar">
        <h1>PEMROGRAMAN WEB DASAR</h1>
        <p>Topik: HTML, PHP, MySQL</p>
    </header>

    <!-- Baris 2: Konten 3 Kolom -->
    <div class="main-container">
        
        <!-- Kolom 1 (Kiri): Memuat Menu Tabel via Iframe -->
        <div class="sidebar-left">
            <iframe src="menu_kiri.html"></iframe>
        </div>

        <!-- Kolom 2 (Tengah): Frame Tempat Menampilkan Halaman Menu -->
        <div class="content-center">
            <iframe name="konten_frame" src="home.html"></iframe>
        </div>

        <!-- Kolom 3 (Kanan): Logo & Link Navigasi Tambahan -->
        <div class="sidebar-right">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/03/Logo_Telkom_University_potrait.png" alt="Logo Tel-U">
            <div class="links-container">
                <a href="#">Link 1</a>
                <a href="#">Link 2</a>
                <a href="#">Link 3</a>
            </div>
        </div>

    </div>

    <!-- Baris 3: Footer -->
    <footer class="footer">
        <p>Dikembangkan oleh: Ahmad Rofi' Izzulhaq</p>
        <p>@ 2026</p>
    </footer>

</body>
</html>
